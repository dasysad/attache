# Bump celestial-intelligence-agency/homebrew-tap when a desktop-v* release is published (ADR-010 / ADR-012).
#
# Dual-arch Cask: arm64 + x86_64 DMGs from the same GitHub release.
#
# Required secret:
#   HOMEBREW_TAP_TOKEN — contents write on celestial-intelligence-agency/homebrew-tap
# Solo project: bumps push straight to tap main (no PR).

name: Bump Homebrew tap

on:
  release:
    types: [published]

jobs:
  bump:
    if: startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#desktop-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and compute sha256
        id: sha
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/attache-desktop-aarch64-${TAG}.dmg"
          URL_INTEL="https://github.com/${REPO}/releases/download/${TAG}/attache-desktop-x86_64-${TAG}.dmg"
          curl -fsSL -o attache-arm.dmg "$URL_ARM"
          curl -fsSL -o attache-intel.dmg "$URL_INTEL"
          SHA_ARM=$(shasum -a 256 attache-arm.dmg | awk '{print $1}')
          SHA_INTEL=$(shasum -a 256 attache-intel.dmg | awk '{print $1}')
          echo "sha256_aarch64=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "sha256_x86_64=$SHA_INTEL" >> "$GITHUB_OUTPUT"

      - name: Checkout attache (bump script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          path: attache-src

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: celestial-intelligence-agency/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update dual-arch Cask
        working-directory: tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA256_AARCH64: ${{ steps.sha.outputs.sha256_aarch64 }}
          SHA256_X86_64: ${{ steps.sha.outputs.sha256_x86_64 }}
        run: |
          set -euo pipefail
          ruby "${GITHUB_WORKSPACE}/attache-src/packages/attache-desktop/scripts/bump-cask-dual-arch.rb"
          if git diff --quiet Casks/attache.rb; then
            echo "Cask already at ${VERSION} — nothing to push"
            echo "noop=true" >> "$GITHUB_ENV"
          fi

      - name: Push Cask bump to tap main
        if: env.noop != 'true'
        working-directory: tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "attache-bump-bot"
          git config user.email "bump-bot@users.noreply.github.com"
          git add Casks/attache.rb
          git commit -m "attache ${VERSION} (arm64 + x86_64)"
          git push origin HEAD:main
          echo "✅ Pushed attache ${VERSION} Cask bump for ${TAG} → homebrew-tap main"
