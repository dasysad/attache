[project]
name = "attache-extract"
version = "0.1.0"
description = "Litestar bill extraction sidecar for Attache (Docling-ready, heuristic default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litestar[standard]>=2.12",
  "pydantic>=2.10",
  "pypdf>=5.1",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
attache-extract = "attache_extract.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attache_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
