<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Attache</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #0f1419; color: #e8eef4; }
  </style>
</head>
<body>
  <p id="msg">Starting Attache…</p>
  <script>
    const base = "http://127.0.0.1:8780";
    const deadline = Date.now() + 120_000;

    async function poll() {
      try {
        const res = await fetch(base + "/health");
        if (res.ok) {
          location.replace(base + "/");
          return;
        }
        if (res.status === 503) {
          // Encrypted DB locked — unlock form is served by the server.
          location.replace(base + "/vault/unlock");
          return;
        }
      } catch {
        /* server not up yet */
      }
      if (Date.now() < deadline) {
        setTimeout(poll, 300);
      } else {
        document.getElementById("msg").textContent =
          "Could not reach Attache. Try restarting the app.";
      }
    }

    poll();
  </script>
</body>
</html>
